services:
  llm:
    tty: true
    build:
      context: .
      dockerfile: ${CONTAINERFILE:-Containerfile}
    container_name: kai-llm
    entrypoint: ["vllm", "serve"]
    command: >
      nvidia/gemma-4-26B-A4B-NVFP4 --host 0.0.0.0 --port 8080
      --kv-cache-dtype fp8
      --enable-prefix-caching
      --tensor-parallel-size 1
      --max-num-batched-tokens 16384
      --gpu-memory-utilization 0.4
      --max-model-len 65536
      --max-num-seqs 8

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0']
              capabilities: [gpu]
    ports:
      - 8080:8080/tcp
    volumes:
      - ${HF_HUB_CACHE:-/opt/huggingface_cache/hub}:/root/.cache/huggingface/hub
      - ${VLLM_CACHE:-./.cache-llm}:/root/.cache/vllm/
    environment:
      - TRITON_CACHE_DIR=/root/.cache/vllm/triton
      - OMP_NUM_THREADS=1
      - FLASHINFER_ENABLE_GQA=1
      - HF_HUB_OFFLINE=1
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 480s